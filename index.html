<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>모닝 리포트</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #f5f0e8;
      color: #1a1a1a;
      font-family: 'Courier New', Courier, monospace;
      font-size: 14px;
      line-height: 1.7;
      padding: 20px 10px;
    }

    #report {
      max-width: 30ch;
      margin: 0 auto;
      white-space: pre-wrap;
      word-break: keep-all;
    }

    .loading {
      text-align: center;
      padding: 40px 0;
      color: #888;
    }

    .error {
      color: #c0392b;
    }
  </style>
</head>
<body>
  <div id="report">
    <span class="loading">로딩 중...</span>
  </div>

  <script>
    async function loadReport() {
      const el = document.getElementById('report');
      try {
        const res = await fetch('report.json?t=' + Date.now());
        if (!res.ok) throw new Error('파일을 찾을 수 없습니다.');
        const data = await res.json();

        let text = '';

        // 날짜 + 제목
        text += data.date + ' 모닝 리포트\n';
        text += '==============================\n\n';

        // 날씨
        text += '【오늘의 날씨】\n';
        text += (data.weather || '정보 없음') + '\n\n';

        // 성무일도
        text += '==============================\n';
        text += '【오늘의 성무일도】\n';
        text += '==============================\n';
        text += (data.liturgy || '정보 없음') + '\n\n';

        // 복음
        text += '==============================\n';
        text += '【오늘의 복음】\n';
        text += '==============================\n';
        if (data.gospel) {
          if (data.gospel.reading1) {
            text += '■ 제1독서\n' + data.gospel.reading1 + '\n\n';
          }
          if (data.gospel.reading2) {
            text += '■ 제2독서\n' + data.gospel.reading2 + '\n\n';
          }
          if (data.gospel.gospel) {
            text += '■ 복음\n' + data.gospel.gospel + '\n\n';
          }
        } else {
          text += '정보 없음\n\n';
        }

        // 일정
        text += '==============================\n';
        text += '【일정】\n';
        text += '==============================\n';
        text += '▶ 어제\n';
        const yesterday = data.calendar?.yesterday;
        text += (yesterday && yesterday.length > 0)
          ? yesterday.map(e => '· ' + e).join('\n') + '\n'
          : '· 일정 없음\n';
        text += '\n▶ 오늘\n';
        const today = data.calendar?.today;
        text += (today && today.length > 0)
          ? today.map(e => '· ' + e).join('\n') + '\n'
          : '· 일정 없음\n';
        text += '\n▶ 내일\n';
        const tomorrow = data.calendar?.tomorrow;
        text += (tomorrow && tomorrow.length > 0)
          ? tomorrow.map(e => '· ' + e).join('\n') + '\n'
          : '· 일정 없음\n';

        // 신문
        text += '\n==============================\n';
        text += '【주요 신문 기사】\n';
        text += '==============================\n';
        const papers = ['hankyoreh', 'chosun', 'joongang', 'donga'];
        const paperNames = {
          hankyoreh: '▶ 한겨레',
          chosun:    '▶ 조선일보',
          joongang:  '▶ 중앙일보',
          donga:     '▶ 동아일보'
        };
        for (const key of papers) {
          text += '\n' + paperNames[key] + '\n';
          const articles = data.news?.[key];
          if (articles && articles.length > 0) {
            articles.forEach((title, i) => {
              text += (i+1) + '. ' + title + '\n';
            });
          } else {
            text += '정보 없음\n';
          }
        }

        text += '\n==============================\n';
        text += '생성: ' + (data.generated_at || '') + '\n';

        el.textContent = text;

      } catch (e) {
        el.innerHTML = '<span class="error">리포트를 불러오지 못했습니다.\n' + e.message + '</span>';
      }
    }

    loadReport();
  </script>
</body>
</html>
