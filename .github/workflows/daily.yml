name: 모닝 리포트 자동 생성

on:
  schedule:
    # ── 예약 시각 설계 메모 ─────────────────────────────────────────
    # GitHub Actions의 예약 실행은 "정시"에 시작되지 않는다. 실측(2026-09)
    # 결과, 02:40 예약이 실제로는 04:22~05:56 KST 사이에 실행됐다.
    # 즉 평균 1시간 40분~2시간 20분 늦는다.
    #
    # 성무일도를 읽는 시각이 04:30~05:00 이므로, 늦어지는 것을 감안해
    # 그보다 훨씬 이른 시각에 여러 번 예약한다. 늦게 돌면 04:30 직전에
    # 들어오고, 제때 돌면 새벽 1~3시에 이미 끝나 있다.
    #
    # 자정을 넘겨야 그날 날짜로 생성되므로 00:15 KST가 가장 이른 예약이다.
    # 혼잡한 정각·30분은 피해서 잡았다.
    #
    # 한국/일본 시간(UTC+9) → UTC 기준 (모두 전날)
    - cron: '15 15 * * *'   # KST 00:15
    - cron: '15 16 * * *'   # KST 01:15
    - cron: '15 17 * * *'   # KST 02:15
    - cron: '5 18 * * *'    # KST 03:05
    - cron: '45 18 * * *'   # KST 03:45
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 의존성 설치
        run: |
          pip install requests beautifulsoup4 lxml icalendar recurring-ical-events

      - name: 리포트 생성
        env:
          WEATHER_API_KEY: ${{ secrets.WEATHER_API_KEY }}
        run: python generate_report.py

      - name: report.json 커밋 & 푸시
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add report.json glasses/ webscope/
          git diff --staged --quiet || git commit -m "리포트 자동 갱신: $(TZ=Asia/Seoul date +'%Y-%m-%d %H:%M') KST"
          git push
