name: 모닝 리포트 자동 생성

on:
  schedule:
    # 한국/일본 시간(UTC+9) 기준 매일 02:40, 03:40, 04:40에 실행 (총 3회)
    # → UTC 기준 17:40, 18:40, 19:40 (모두 전날)
    - cron: '40 17 * * *'   # KST 02:40
    - cron: '40 18 * * *'   # KST 03:40
    - cron: '40 19 * * *'   # KST 04:40
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 의존성 설치
        run: |
          pip install requests beautifulsoup4 lxml icalendar recurring-ical-events

      - name: 리포트 생성
        env:
          WEATHER_API_KEY: ${{ secrets.WEATHER_API_KEY }}
        run: python generate_report.py

      - name: report.json 커밋 & 푸시
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add report.json glasses/ webscope/
          git diff --staged --quiet || git commit -m "리포트 자동 갱신: $(date +'%Y-%m-%d')"
          git push
