name: 모닝 리포트 자동 생성

on:
  schedule:
    # 매일 새벽 4시 (KST) = UTC 16:00 (전날)
   - cron: '30 18 * * *'
  workflow_dispatch:   # 수동 실행 버튼 (테스트용)

jobs:
  generate:
    runs-on: ubuntu-latest

    permissions:
      contents: write   # report.json을 커밋하기 위해 필요

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 의존성 설치
        run: |
          pip install requests beautifulsoup4 lxml google-api-python-client google-auth google-auth-oauthlib

      - name: 리포트 생성
        env:
          WEATHER_API_KEY: ${{ secrets.WEATHER_API_KEY }}
          GOOGLE_OAUTH_TOKEN: ${{ secrets.GOOGLE_OAUTH_TOKEN }}
          GOOGLE_CALENDAR_CREDS: ${{ secrets.GOOGLE_CALENDAR_CREDS }}
        run: python generate_report.py

      - name: report.json 커밋 & 푸시
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add report.json
          git diff --staged --quiet || git commit -m "리포트 자동 갱신: $(date +'%Y-%m-%d')"
          git push
